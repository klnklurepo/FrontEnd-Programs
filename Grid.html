
<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Demonstration</title>

    <style>

        /* General Styling */
        body {
            font-family: Arial;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: navy;
        }

        /* GRID CONTAINER */
        .grid-container {
            display: grid;

            /* Three equal columns */
            grid-template-columns: repeat(3, 1fr);

            /* Two rows */
            grid-template-rows: 100px 100px;

            /* Spacing between rows and columns */
            gap: 10px;

            /* Horizontal and vertical alignment */
            justify-items: stretch;
            align-items: stretch;

            /* Grid container alignment */
            justify-content: center;
            align-content: center;

            border: 3px solid black;
            padding: 10px;

            /* Minimum height for the grid */
            min-height: 350px;

            /* Automatic row height */
            grid-auto-rows: 100px;
        }

        /* COMMON GRID ITEM */
        .box {
            background-color: lightblue;
            border: 2px solid blue;
            text-align: center;
            padding: 10px;
            font-size: 18px;
        }

        /* Item occupies two columns */
        .box1 {
            grid-column: 1 / 3;
            background-color: lightgreen;
        }

        /* Item occupies two rows */
        .box2 {
            grid-row: 2 / 4;
            background-color: lightpink;
        }

        /* Individual horizontal alignment */
        .box3 {
            justify-self: center;
        }

        /* Individual vertical alignment */
        .box4 {
            align-self: center;
        }

        /* Both horizontal and vertical alignment */
        .box5 {
            place-self: center;
        }

        /* Responsive layout for smaller screens */
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

    </style>
</head>

<body>

    <h1>CSS Grid Layout Demonstration</h1>

    <h2>Grid Container and Grid Items</h2>

    <div class="grid-container">

        <div class="box box1">
            Box 1 - Spans 2 Columns
        </div>

        <div class="box box2">
            Box 2 - Spans 2 Rows
        </div>

        <div class="box box3">
            Box 3 - Horizontal Alignment
        </div>

        <div class="box box4">
            Box 4 - Vertical Alignment
        </div>

        <div class="box box5">
            Box 5 - Both Alignments
        </div>

        <div class="box">
            Box 6
        </div>

        <div class="box">
            Box 7 - Automatic Row
        </div>

    </div>

</body>
</html>

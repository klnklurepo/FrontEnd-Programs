
<!DOCTYPE html>
<html>
<head>
    <title>Styled Table</title>
    <link rel="stylesheet" type="text/css" href="tablestyle.css">
</head>
<body>

    <h2>Student Details</h2>

    <table border="1">
        <caption><b>Table Caption</b>: College Student Details</caption>
        <tr>
            <th>Department</th>
            <th colspan="2">Student and Year</th>
            
        </tr>

        <tr>
            <td rowspan="2">CSE</td>
            <td>Ravi</td>
            <td>II</td>
        </tr>

        <tr>
            <td>Sita</td>
            <td>III</td>
        </tr>

        <tr>
            <td>ECE</td>
            <td>Rahul</td>
            <td>II</td>
        </tr>
    </table>

    

</body>
</html>

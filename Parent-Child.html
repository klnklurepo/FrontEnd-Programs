<!DOCTYPE html>
<html>
<head>
    <title>CSS Percentage Example</title>

    <style>
        /* Parent Container */
        .parent {
            width: 800px;
            height: 400px;
            background-color: lightgray;
            border: 3px solid black;
        }

        /* Child Container */
        .child {
            width: 50%;
            height: 50%;
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h2>Parent and Child Size Example</h2>

    <div class="parent">

        <div class="child">
            <h3>Child Container</h3>
            <p>Width: 50%</p>
            <p>Height: 50%</p>
        </div>

    </div>

</body>
</html>

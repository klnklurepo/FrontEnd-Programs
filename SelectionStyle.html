<!DOCTYPE html>
<html>
<head>
    <title>Selection Example</title>

    <style>
        p::selection {
            background-color: yellow;
            color: red;
        }
    </style>
</head>

<body>

    <h2>CSS Selection Example</h2>

    <p>
        CSS is used to design and style webpages.
    </p>

    <p>
        Select this paragraph using your mouse
        to see the selection effect.
    </p>

</body>
</html>
